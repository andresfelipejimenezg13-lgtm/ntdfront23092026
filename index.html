<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow - Gestor de Tareas</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Añadimos una fuente moderna de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="contenedor">
    <header class="cabecera">
      <h1>TaskFlow 🚀</h1>
      <p class="subtitulo">Organiza tu día de forma sencilla</p>
    </header>

    <form id="form-tarea" class="formulario">
      <div class="input-group">
        <input
          type="text"
          id="input-tarea"
          placeholder="¿Qué necesitas hacer hoy?..."
          autocomplete="off"
          required
        />
        <select id="input-estado">
          <option value="pendiente">⏳ Pendiente</option>
          <option value="en_progreso">⚙️ En progreso</option>
          <option value="completada">✅ Completada</option>
        </select>
      </div>
      <button type="submit">Agregar Tarea</button>
    </form>

    <p id="mensaje" class="mensaje oculto"></p>

    <ul id="lista-tareas" class="lista-tareas"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
